<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon wedsite</title>
    <link rel="stylesheet" href="../Css/Amazon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="Top">
        <nav class="navbar">
            <img src="../Assets/amazon_logo.png" alt="Amazon logo">
            <div id="userLocation">
                <i class="fa fa-light fa-location-dot"></i>
            <div id="location">
                <p>Deliver</p>
                <p>Chennai</p>
            </div>
        </div>
        <div id="search">
            <select name="" id="ourproduct">
                <option value="all">All</option>
                <option value="all">Laptop</option>
                <option value="all">Mobiles</option>
            </select>
            <input type="text" placeholder="Search Amazon" id="searchinput">
            <div id="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
        <p>Sign In</p>
        <p>Orders</p>
        <i class="fa fa-light fa-cart-shopping" style="color:#fff" id="cart"></i>
        </nav>
    </header>
    <nav id="secondary-nav">
        <div id="menu">
            <i class="fa-solid fa-bars fa-lg "style="color:#fff" ></i>
            <p>All</p>
            <p>Today's Deals</p>
            <p>Customer Service</p>
            <p>Registry</p>
            <p>Gift Cards</p>
            <p>Sell</p>
            <p>Shop deals in Electronics</p>
        </div>
    </nav>
    <img src="../Assets/banner.jpg" alt="Amazon prime day"id="primeday">
    <div id="shopingitem">
        <div class="product">
            <p>Shop Trendy T-Shirts</p>
            <img src="../Assets/tshirt.png" alt="T-shirt">
            <p>Shop now</p>
        </div>
        <div class="product">
            <p>Shop Durable Bikes</p>
            <img src="../Assets/Bike.webp" alt="Cycle">
            <p>Shop now</p>
        </div>
        <div class="product">
            <p>Shop The Clothes</p>
            <img src="../Assets/clothes.png" alt="CLothes" class="fiximage">
            <p>Shop now</p>
        </div>
        <div class="product">
            <p>Shop Protective Helmet</p>
            <img src="../Assets/helmet.png" alt="Helmet">
            <p>Shop now</p>
        </div>
    </div>
    <div id="movingforward">
        <a href="#Top">Back to top</a>
    </div>
</body>
</html>
